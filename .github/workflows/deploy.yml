name: Deploy

# Deploy to the VPS only after the CI workflow succeeds on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # For workflow_run: only on success. For manual dispatch: always run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/pigtrack-pro
            git fetch --all
            git reset --hard origin/main
            cd deploy
            docker compose up -d --build
            docker image prune -f
            # Self-heal SSH brute-force protection so it can never lock out an
            # operator or this deploy runner: apply the in-repo (non-aggressive)
            # jail, reload, and clear any stale bans.
            [ -f /opt/pigtrack-pro/deploy/fail2ban-sshd.local ] && install -m 644 /opt/pigtrack-pro/deploy/fail2ban-sshd.local /etc/fail2ban/jail.d/sshd.local || true
            systemctl reload fail2ban 2>/dev/null || systemctl restart fail2ban || true
            fail2ban-client unban --all || true
            systemctl is-active --quiet ssh || systemctl restart ssh

      - name: Smoke test (fail the deploy if the API is unhealthy)
        run: |
          set -e
          BASE=https://api.the-pigsty.org
          echo "Waiting for API to come back after deploy..."
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$BASE/api/health" || echo 000)
            echo "  attempt $i: /api/health -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 6
          done
          [ "$ok" = "1" ] || { echo "::error::Health check never returned 200 after deploy"; exit 1; }
          # Auth path must reject bad creds (proves DB + bcrypt, not just a static 200).
          login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$BASE/api/auth/login" \
            -H 'Content-Type: application/json' -d '{"email":"smoke@example.com","password":"wrong"}' || echo 000)
          echo "  /api/auth/login (bad creds) -> $login"
          case "$login" in 400|401) echo "Smoke test passed ✅";; *) echo "::error::Login endpoint returned $login (expected 400/401)"; exit 1;; esac
